{{- if and .Values.metrics.enabled .Values.metrics.grafanaDashboard.enabled }}
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: {{ include "truenas-csi.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "truenas-csi.labels" . | nindent 4 }}
    {{- with .Values.metrics.grafanaDashboard.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.metrics.grafanaDashboard.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  allowCrossNamespaceImport: {{ .Values.metrics.grafanaDashboard.allowCrossNamespaceImport }}
  resyncPeriod: {{ .Values.metrics.grafanaDashboard.resyncPeriod | quote }}
  configMapRef:
    name: {{ include "truenas-csi.fullname" . }}-grafana-dashboard
    key: ix-csi.json
  {{- with .Values.metrics.grafanaDashboard.datasources }}
  datasources:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.metrics.grafanaDashboard.folder }}
  folder: {{ . | quote }}
  {{- end }}
  instanceSelector:
    matchLabels:
      {{- toYaml .Values.metrics.grafanaDashboard.instanceSelector.matchLabels | nindent 6 }}
{{- end }}
