{{- if and .Values.metrics.enabled (or .Values.metrics.dashboards.enabled .Values.metrics.grafanaDashboard.enabled) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "truenas-csi.fullname" . }}-grafana-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "truenas-csi.labels" . | nindent 4 }}
    grafana_dashboard: "1"
  {{- with .Values.metrics.dashboards.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  ix-csi.json: |-
    {
      "annotations": {"list": []},
      "editable": true,
      "graphTooltip": 1,
      "panels": [
        {
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "id": 1,
          "targets": [{"expr": "sum by (operation) (rate(ix_csi_operations_total[$__rate_interval]))", "legendFormat": "operation", "refId": "A"}],
          "title": "CSI RPC Rate",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "id": 2,
          "targets": [{"expr": "histogram_quantile(0.95, sum by (operation, le) (rate(ix_csi_operations_duration_seconds_bucket[$__rate_interval])))", "legendFormat": "p95", "refId": "A"}],
          "title": "CSI RPC Latency (p95)",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "id": 3,
          "targets": [{"expr": "sum by (operation, code) (rate(ix_csi_operations_total{status=\"error\"}[$__rate_interval]))", "legendFormat": "error", "refId": "A"}],
          "title": "CSI RPC Errors",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "fieldConfig": {"defaults": {"unit": "percentunit"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "id": 4,
          "targets": [{"expr": "sum(rate(ix_csi_truenas_requests_total{status=\"error\"}[$__rate_interval])) / sum(rate(ix_csi_truenas_requests_total[$__rate_interval]))", "legendFormat": "error rate", "refId": "A"}],
          "title": "TrueNAS API Error Rate",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 0, "y": 16},
          "id": 5,
          "targets": [{"expr": "ix_csi_truenas_connection_status", "legendFormat": "connected", "refId": "A"}],
          "title": "TrueNAS Connection",
          "type": "stat"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 8, "y": 16},
          "id": 6,
          "targets": [{"expr": "sum by (result) (rate(ix_csi_truenas_reconnects_total[$__rate_interval]))", "legendFormat": "reconnect", "refId": "A"}],
          "title": "TrueNAS Reconnects",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "fieldConfig": {"defaults": {"unit": "bytes"}, "overrides": []},
          "gridPos": {"h": 8, "w": 8, "x": 16, "y": 16},
          "id": 7,
          "targets": [{"expr": "sum by (pool, protocol) (ix_csi_provisioned_capacity_bytes)", "legendFormat": "capacity", "refId": "A"}],
          "title": "Provisioned Capacity",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 24},
          "id": 8,
          "targets": [{"expr": "sum by (pool, protocol) (ix_csi_provisioned_volumes)", "legendFormat": "volumes", "refId": "A"}],
          "title": "Provisioned Volumes",
          "type": "timeseries"
        },
        {
          "gridPos": {"h": 2, "w": 24, "x": 0, "y": 32},
          "id": 9,
          "options": {"content": "## CSI sidecars\\n\\nThe external-provisioner, external-attacher, external-snapshotter, and external-resizer expose the shared `csi_sidecar_operations_seconds` histogram.", "mode": "markdown"},
          "title": "CSI Sidecar Metrics",
          "type": "text"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 34},
          "id": 10,
          "targets": [{"expr": "sum by (method_name) (rate(csi_sidecar_operations_seconds_count{driver_name=\"csi.truenas.io\"}[$__rate_interval]))", "legendFormat": "{{`{{method_name}}`}}", "refId": "A"}],
          "title": "CSI Sidecar Operation Rate",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 34},
          "id": 11,
          "targets": [{"expr": "histogram_quantile(0.95, sum by (method_name, le) (rate(csi_sidecar_operations_seconds_bucket{driver_name=\"csi.truenas.io\"}[$__rate_interval])))", "legendFormat": "{{`{{method_name}}`}} p95", "refId": "A"}],
          "title": "CSI Sidecar Operation Latency (p95)",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "gridPos": {"h": 8, "w": 24, "x": 0, "y": 42},
          "id": 12,
          "targets": [{"expr": "sum by (method_name, grpc_status_code) (rate(csi_sidecar_operations_seconds_count{driver_name=\"csi.truenas.io\",grpc_status_code!=\"OK\"}[$__rate_interval]))", "legendFormat": "{{`{{method_name}}`}} {{`{{grpc_status_code}}`}}", "refId": "A"}],
          "title": "CSI Sidecar Operation Errors",
          "type": "timeseries"
        },
        {
          "gridPos": {"h": 2, "w": 24, "x": 0, "y": 50},
          "id": 13,
          "options": {"content": "## External-provisioner metrics\\n\\nThe external-provisioner also reports PVC provision and persistent-volume delete outcomes and latency, broken down by StorageClass.", "mode": "markdown"},
          "title": "External-provisioner Metrics",
          "type": "text"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 52},
          "id": 14,
          "targets": [
            {"expr": "sum by (class, source) (rate(controller_persistentvolumeclaim_provision_total[$__rate_interval]))", "legendFormat": "provision {{`{{class}}`}} {{`{{source}}`}}", "refId": "A"},
            {"expr": "sum by (class, source) (rate(controller_persistentvolumeclaim_provision_failed_total[$__rate_interval]))", "legendFormat": "provision failed {{`{{class}}`}} {{`{{source}}`}}", "refId": "B"}
          ],
          "title": "Provision Outcomes",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 52},
          "id": 15,
          "targets": [{"expr": "histogram_quantile(0.95, sum by (class, source, le) (rate(controller_persistentvolumeclaim_provision_duration_seconds_bucket[$__rate_interval])))", "legendFormat": "{{`{{class}}`}} {{`{{source}}`}} p95", "refId": "A"}],
          "title": "Provision Latency (p95)",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 60},
          "id": 16,
          "targets": [
            {"expr": "sum by (class) (rate(controller_persistentvolume_delete_total[$__rate_interval]))", "legendFormat": "delete {{`{{class}}`}}", "refId": "A"},
            {"expr": "sum by (class) (rate(controller_persistentvolume_delete_failed_total[$__rate_interval]))", "legendFormat": "delete failed {{`{{class}}`}}", "refId": "B"}
          ],
          "title": "Delete Outcomes",
          "type": "timeseries"
        },
        {
          "datasource": {"type": "prometheus", "uid": "$datasource"},
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 60},
          "id": 17,
          "targets": [{"expr": "histogram_quantile(0.95, sum by (class, le) (rate(controller_persistentvolume_delete_duration_seconds_bucket[$__rate_interval])))", "legendFormat": "{{`{{class}}`}} p95", "refId": "A"}],
          "title": "Delete Latency (p95)",
          "type": "timeseries"
        }
      ],
      "schemaVersion": 39,
      "tags": ["ix-csi", "truenas", "csi"],
      "templating": {"list": [{"current": {}, "label": "Prometheus", "name": "datasource", "query": "prometheus", "type": "datasource"}]},
      "time": {"from": "now-6h", "to": "now"},
      "title": "TrueNAS CSI Driver",
      "uid": "ix-csi",
      "version": 1
    }
{{- end }}
