apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: {{ include "truenas-csi.driverName" . }}
  labels:
    {{- include "truenas-csi.labels" . | nindent 4 }}
spec:
  attachRequired: true
  podInfoOnMount: true
  fsGroupPolicy: File
  volumeLifecycleModes:
    - Persistent
    - Ephemeral
