nameOverride: ""
fullnameOverride: ""

image:
  repository: ghcr.io/truenas/truenas-csi
  tag: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

sidecars:
  provisioner:
    repository: registry.k8s.io/sig-storage/csi-provisioner
    tag: v6.1.1
  attacher:
    repository: registry.k8s.io/sig-storage/csi-attacher
    tag: v4.11.0
  snapshotter:
    repository: registry.k8s.io/sig-storage/csi-snapshotter
    tag: v8.5.0
  resizer:
    repository: registry.k8s.io/sig-storage/csi-resizer
    tag: v2.1.0
  nodeDriverRegistrar:
    repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
    tag: v2.16.0
  livenessProbe:
    repository: registry.k8s.io/sig-storage/livenessprobe
    tag: v2.18.0

config:
  truenasURL: wss://truenas.example.com/api/current
  truenasInsecure: true
  defaultPool: tank
  nfsServer: ""
  iscsiPortal: ""
  nvmeofPortal: ""
  iscsiIQNBase: iqn.2000-01.io.truenas
  kernelModulesHostPath: /lib/modules

secret:
  existingSecret:
    name: ""
    key: TRUENAS_API_KEY
  name: truenas-api-credentials
  apiKey: ""

serviceAccount:
  controller:
    create: true
    name: ""
    annotations: {}
  node:
    create: true
    name: ""
    annotations: {}

rbac:
  create: true

openshift:
  enabled: false

controller:
  replicas: 1
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m
  logLevel: 4
  extraEnv: []
  extraVolumeMounts: []
  extraVolumes: []

node:
  priorityClassName: system-node-critical
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations:
    - operator: Exists
  affinity: {}
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m
  logLevel: 4
  extraEnv: []
  extraVolumeMounts: []
  extraVolumes: []
  kubeletRootDir: /var/lib/kubelet
  iscsiDir: /etc/iscsi

storageClasses: []
