nameOverride: ""
fullnameOverride: ""

# Controls logging for the CSI driver and every Kubernetes sidecar.
# error maps to --v=0, warning to --v=1, info to --v=2, and debug to --v=4.
# Kubernetes logging cannot strictly filter by severity, so error and warning
# may still include ordinary info messages emitted at the default verbosity.
logLevel: info

metrics:
  # -- Enable driver-native and CSI sidecar Prometheus endpoints and metrics Services.
  enabled: false
  # -- TCP port used by the driver-native Prometheus endpoint.
  port: 9809
  service:
    # -- Additional annotations for the controller and node metrics Services.
    annotations: {}
  serviceMonitor:
    # -- Create Prometheus Operator ServiceMonitor resources.
    enabled: false
    # -- Additional labels for ServiceMonitor selection by Prometheus.
    labels: {}
    # -- Additional ServiceMonitor annotations.
    annotations: {}
    # -- Prometheus scrape interval.
    interval: 30s
    # -- Prometheus scrape timeout.
    scrapeTimeout: 10s
  dashboards:
    # -- Create a Grafana sidecar-discovery ConfigMap.
    enabled: false
    # -- Additional annotations for the dashboard ConfigMap.
    annotations: {}
  grafanaDashboard:
    # -- Create a Grafana Operator GrafanaDashboard resource.
    enabled: false
    # -- Grafana folder for the GrafanaDashboard resource.
    folder: ""
    # -- Additional labels for the GrafanaDashboard resource.
    labels: {}
    # -- Additional annotations for the GrafanaDashboard resource.
    annotations: {}
    # -- Grafana Operator instance selector for the dashboard resource.
    instanceSelector:
      matchLabels:
        dashboards: grafana

image:
  repository: ghcr.io/ishioni/ix-csi
  # Used when no digest is set. An empty value uses the chart appVersion.
  tag: ""
  # The release workflow sets this to pin released charts to an immutable image.
  digest: ""
  pullPolicy: IfNotPresent
  pullSecrets: []

config:
  truenasURL: wss://truenas.example.com/api/current
  truenasInsecure: true
  defaultPool: tank
  nfsServer: ""
  iscsiPortal: ""
  nvmeofPortal: ""
  iscsiIQNBase: iqn.2000-01.io.truenas
  # Required when detachedSnapshots is enabled.
  # Keep this dataset root separate from normal CSI volume datasets.
  detachedSnapshotParentDataset: ""

secret:
  existingSecret:
    name: ""
    key: TRUENAS_API_KEY
  name: truenas-api-credentials
  apiKey: ""

serviceAccount:
  controller:
    create: true
    name: ""
    annotations: {}
  node:
    create: true
    name: ""
    annotations: {}

rbac:
  create: true

openshift:
  # Create OpenShift SCCs and the certification capabilities ConfigMap.
  enabled: false

controller:
  image:
    # Overrides the global image tag or digest for the controller only.
    tag: ""
    digest: ""
  replicas: 1
  priorityClassName: ""
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m
  extraEnv: []
  extraVolumeMounts: []
  extraVolumes: []

node:
  image:
    # Overrides the global image tag or digest for the node only.
    tag: ""
    digest: ""
  priorityClassName: system-node-critical
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations:
    - operator: Exists
  affinity: {}
  resources:
    requests:
      memory: 128Mi
      cpu: 100m
    limits:
      memory: 256Mi
      cpu: 200m
  extraEnv: []
  extraVolumeMounts: []
  extraVolumes: []
  kubeletRootDir: /var/lib/kubelet
  iscsiDir: /etc/iscsi

