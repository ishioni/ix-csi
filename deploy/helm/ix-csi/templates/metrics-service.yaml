{{- if .Values.metrics.enabled }}
{{- if has (int .Values.metrics.port) (list 9801 9802 9803 9804 9808) }}
{{- fail "metrics.port must not conflict with CSI sidecar ports (9801-9804) or the liveness probe port (9808) when metrics.enabled=true" }}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ix-csi.fullname" . }}-controller-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ix-csi.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
  {{- with .Values.metrics.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
    - name: prov-metrics
      port: 9801
      targetPort: prov-metrics
      protocol: TCP
    - name: attach-metrics
      port: 9802
      targetPort: attach-metrics
      protocol: TCP
    - name: snap-metrics
      port: 9803
      targetPort: snap-metrics
      protocol: TCP
    - name: resize-metrics
      port: 9804
      targetPort: resize-metrics
      protocol: TCP
  selector:
    {{- include "ix-csi.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: controller
{{- if .Values.metrics.node.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "ix-csi.fullname" . }}-node-metrics
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ix-csi.labels" . | nindent 4 }}
    app.kubernetes.io/component: node
  {{- with .Values.metrics.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: metrics
      port: {{ .Values.metrics.port }}
      targetPort: metrics
      protocol: TCP
  selector:
    {{- include "ix-csi.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: node
{{- end }}
{{- end }}
