apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "ix-csi.fullname" . }}-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ix-csi.labels" . | nindent 4 }}
    app.kubernetes.io/component: controller
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      {{- include "ix-csi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: controller

  template:
    metadata:
      labels:
        {{- include "ix-csi.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: controller
        {{- with .Values.controller.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ toYaml .Values.config | sha256sum }}
        checksum/secret: {{ toYaml .Values.secret | sha256sum }}
        {{- with .Values.controller.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "ix-csi.controllerServiceAccountName" . }}
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.controller.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.controller.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: csi-controller
          image: {{ include "ix-csi.image" (dict "root" . "component" .Values.controller) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --endpoint=$(CSI_ENDPOINT)
            - --node-id=$(NODE_ID)
            - --mode=controller
            - --v={{ include "ix-csi.logVerbosity" . }}
            {{- if .Values.metrics.enabled }}
            - --metrics-addr=:{{ .Values.metrics.port }}
            {{- end }}
          {{- if .Values.metrics.enabled }}
          ports:
            - name: metrics
              containerPort: {{ .Values.metrics.port }}
              protocol: TCP
            - name: prov-metrics
              containerPort: 9801
              protocol: TCP
            - name: attach-metrics
              containerPort: 9802
              protocol: TCP
            - name: snap-metrics
              containerPort: 9803
              protocol: TCP
            - name: resize-metrics
              containerPort: 9804
              protocol: TCP
          {{- end }}
          env:
            - name: CSI_ENDPOINT
              value: unix:///csi/csi.sock
            - name: NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: TRUENAS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "ix-csi.secretName" . }}
                  key: {{ include "ix-csi.secretKey" . }}
            {{- with .Values.controller.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "ix-csi.configMapName" . }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
            {{- with .Values.controller.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.controller.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9808
            initialDelaySeconds: 10
            timeoutSeconds: 3
            periodSeconds: 10
            failureThreshold: 5
        - name: csi-provisioner
          image: registry.k8s.io/sig-storage/csi-provisioner:v6.1.1
          args:
            - --csi-address=$(ADDRESS)
            - --v={{ include "ix-csi.logVerbosity" . }}
            - --feature-gates=Topology=true
            - --extra-create-metadata
            - --leader-election=true
            - --default-fstype=ext4
            - --timeout=60s
            {{- if .Values.metrics.enabled }}
            - --http-endpoint=:9801
            {{- end }}
          {{- if .Values.metrics.enabled }}
          ports:
            - name: prov-metrics
              containerPort: 9801
              protocol: TCP
          {{- end }}
          env:
            - name: ADDRESS
              value: /csi/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /csi

        - name: csi-attacher
          image: registry.k8s.io/sig-storage/csi-attacher:v4.11.0
          args:
            - --csi-address=$(ADDRESS)
            - --v={{ include "ix-csi.logVerbosity" . }}
            - --leader-election=true
            - --timeout=60s
            {{- if .Values.metrics.enabled }}
            - --http-endpoint=:9802
            {{- end }}
          {{- if .Values.metrics.enabled }}
          ports:
            - name: attach-metrics
              containerPort: 9802
              protocol: TCP
          {{- end }}
          env:
            - name: ADDRESS
              value: /csi/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /csi

        - name: csi-snapshotter
          image: registry.k8s.io/sig-storage/csi-snapshotter:v8.5.0
          args:
            - --csi-address=$(ADDRESS)
            - --v={{ include "ix-csi.logVerbosity" . }}
            - --leader-election=true
            - --timeout=60s
            {{- if .Values.metrics.enabled }}
            - --http-endpoint=:9803
            {{- end }}
          {{- if .Values.metrics.enabled }}
          ports:
            - name: snap-metrics
              containerPort: 9803
              protocol: TCP
          {{- end }}
          env:
            - name: ADDRESS
              value: /csi/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /csi

        - name: csi-resizer
          image: registry.k8s.io/sig-storage/csi-resizer:v2.1.0
          args:
            - --csi-address=$(ADDRESS)
            - --v={{ include "ix-csi.logVerbosity" . }}
            - --leader-election=true
            - --timeout=60s
            {{- if .Values.metrics.enabled }}
            - --http-endpoint=:9804
            {{- end }}
          {{- if .Values.metrics.enabled }}
          ports:
            - name: resize-metrics
              containerPort: 9804
              protocol: TCP
          {{- end }}
          env:
            - name: ADDRESS
              value: /csi/csi.sock
          volumeMounts:
            - name: socket-dir
              mountPath: /csi

        - name: liveness-probe
          image: registry.k8s.io/sig-storage/livenessprobe:v2.18.0
          args:
            - --csi-address=/csi/csi.sock
            - --health-port=9808
            - --v={{ include "ix-csi.logVerbosity" . }}
          volumeMounts:
            - name: socket-dir
              mountPath: /csi

      volumes:
        - name: socket-dir
          emptyDir: {}
        {{- with .Values.controller.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
