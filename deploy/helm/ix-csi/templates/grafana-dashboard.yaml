{{- if and .Values.metrics.enabled (or .Values.metrics.dashboards.enabled .Values.metrics.grafanaDashboard.enabled) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "ix-csi.fullname" . }}-grafana-dashboard
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ix-csi.labels" . | nindent 4 }}
    grafana_dashboard: "1"
  {{- with .Values.metrics.dashboards.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  ix-csi.json: |-
{{ .Files.Get "dashboard/ix-csi.json" | nindent 4 }}
{{- end }}
